<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MachZero™</title>
  <link rel="icon" href="/logo1.jpg">
  <link rel="apple-touch-icon" href="/logo1.jpg">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#070b19;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
    body{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:24px;position:relative}
    body::before{content:"";position:absolute;inset:-25%;background:radial-gradient(circle at 50% 42%,rgba(56,189,248,.18),transparent 34%),radial-gradient(circle at 50% 58%,rgba(16,185,129,.12),transparent 38%);filter:blur(8px);animation:breathe 2.8s ease-in-out infinite}
    .splash{position:relative;z-index:1;width:min(92vw,430px);display:flex;flex-direction:column;align-items:center;text-align:center}
    .studio-wrap{width:100%;min-height:170px;display:flex;align-items:center;justify-content:center;position:relative}
    .studio-fallback{position:absolute;font-size:clamp(1.55rem,7vw,2.45rem);font-weight:950;letter-spacing:-1px;line-height:1.05;color:#f8fafc;text-shadow:0 0 24px rgba(56,189,248,.28)}
    .studio-logo{position:relative;width:min(88vw,390px);max-height:210px;object-fit:contain;display:block;filter:drop-shadow(0 14px 36px rgba(0,0,0,.45));animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
    .app-lockup{margin-top:-18px;display:flex;flex-direction:column;align-items:center;animation:rise .75s .12s cubic-bezier(.2,.8,.2,1) both}
    .app-logo-shell{width:132px;height:132px;border-radius:28px;padding:5px;background:linear-gradient(145deg,rgba(56,189,248,.95),rgba(16,185,129,.72));box-shadow:0 0 0 1px rgba(255,255,255,.08),0 18px 50px rgba(0,0,0,.48),0 0 34px rgba(56,189,248,.18)}
    .app-logo{width:100%;height:100%;object-fit:cover;border-radius:23px;display:block}
    .app-name{margin-top:16px;font-size:1.45rem;font-weight:900;letter-spacing:2px;text-transform:uppercase}
    .studio-tag{margin-top:7px;font-size:.76rem;letter-spacing:1.4px;text-transform:uppercase;color:#94a3b8}
    .loader{width:160px;height:3px;margin-top:28px;border-radius:99px;background:rgba(148,163,184,.16);overflow:hidden}
    .loader::after{content:"";display:block;width:42%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#38bdf8,#10b981);animation:load 1.2s ease-in-out infinite}
    .rights{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));z-index:2;text-align:center;font-size:.65rem;color:#64748b;letter-spacing:.4px;padding:0 16px}
    @keyframes rise{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes load{0%{transform:translateX(-130%)}55%,100%{transform:translateX(250%)}}
    @keyframes breathe{0%,100%{opacity:.72;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
    @media (prefers-reduced-motion:reduce){body::before,.studio-logo,.app-lockup,.loader::after{animation:none}}
  </style>
</head>
<body>
  <main class="splash" aria-label="MachZero loading">
    <div class="studio-wrap">
      <div class="studio-fallback">Cactus🌵Byte Studios™</div>
      <img class="studio-logo" src="https://raw.githubusercontent.com/Brett81Ross/cactusbyte-studios/main/public/logo2.png" alt="Cactus Byte Studios" decoding="async" fetchpriority="low">
    </div>
    <div class="app-lockup">
      <div class="app-logo-shell"><img class="app-logo" src="/logo1.jpg" alt="MachZero logo" decoding="async"></div>
      <div class="app-name">MachZero™</div>
      <div class="studio-tag">A Cactus🌵Byte Studios™ App</div>
      <div class="loader" aria-hidden="true"></div>
    </div>
  </main>
  <div class="rights">MachZero™ · Cactus🌵Byte Studios™ · All Rights Reserved</div>
  <script>
    (()=>{
      let moved=false;
      const go=()=>{if(moved)return;moved=true;location.replace('/index.html')};
      setTimeout(go,500);
    })();
  </script>
</body>
</html>
