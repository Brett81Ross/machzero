name: MachZero Android Play Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/machzero-android.yml"

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Run Play static gate
        working-directory: android-app
        run: npm run play-check

      - name: Install Capacitor dependencies
        working-directory: android-app
        run: npm install

      - name: Generate Android project
        working-directory: android-app
        run: npm run android:init

      - name: Build release AAB
        working-directory: android-app/android
        run: ./gradlew bundleRelease

      - name: Sign AAB when upload-key secrets are configured
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MACHZERO_UPLOAD_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.MACHZERO_UPLOAD_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.MACHZERO_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MACHZERO_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          AAB="android-app/android/app/build/outputs/bundle/release/app-release.aab"
          OUT_DIR="android-app/play-output"
          mkdir -p "$OUT_DIR"

          if [[ -n "${KEYSTORE_B64}" && -n "${KEY_ALIAS}" && -n "${STORE_PASSWORD}" && -n "${KEY_PASSWORD}" ]]; then
            echo "${KEYSTORE_B64}" | base64 --decode > android-app/upload-keystore.jks
            jarsigner               -sigalg SHA256withRSA               -digestalg SHA-256               -keystore android-app/upload-keystore.jks               -storepass "${STORE_PASSWORD}"               -keypass "${KEY_PASSWORD}"               "$AAB" "${KEY_ALIAS}"
            jarsigner -verify -verbose -certs "$AAB"
            cp "$AAB" "$OUT_DIR/MachZero-v1.4.2-code1-SIGNED.aab"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            cp "$AAB" "$OUT_DIR/MachZero-v1.4.2-code1-UNSIGNED-DO-NOT-UPLOAD.aab"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Upload-key secrets are not configured; generated bundle is for build validation only."
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: machzero-play-v1.4.2
          path: android-app/play-output/*.aab
          if-no-files-found: error
          retention-days: 14
